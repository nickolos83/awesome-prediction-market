name: Mining revenue data

on:
  push:
    branches: [claude/mining-shares-2017-2026-jxgczv]
    paths: [mining-shares/fetch_revenue.py, mining-shares/probe_sa.py, .github/workflows/mining-revenue.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas requests
      - run: python mining-shares/probe_sa.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add mining-shares/revenue
          git commit -m "Update mining revenue data" || echo "No changes"
          git pull --rebase origin ${{ github.ref_name }}
          git push
