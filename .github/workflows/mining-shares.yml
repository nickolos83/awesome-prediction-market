name: Mining shares data

on:
  push:
    branches: [claude/mining-shares-2017-2026-jxgczv]
    paths: [mining-shares/fetch_prices.py, mining-shares/companies.csv, .github/workflows/mining-shares.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas openpyxl
      - run: python mining-shares/fetch_prices.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add mining-shares/mining_shares_2017_2026.*
          git commit -m "Update mining share price data" || echo "No changes"
          git push
